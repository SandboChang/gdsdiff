[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdsdiff"
version = "0.1.0rc1"
description = "Exact, evidence-oriented comparison of GDSII layout geometry"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
  {name = "Sandbo Chang", email = "sandbochang@outlook.com"},
]
keywords = ["GDSII", "CAD", "layout", "geometry", "verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "gdstk>=1.0.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23",
  "pytest>=8",
  "tomli; python_version < '3.11'",
]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "pytest>=8",
  "tomli; python_version < '3.11'",
  "twine>=5",
]
native-dev = [
  "cmake>=3.24",
  "pybind11>=2.12",
]

[project.scripts]
gdsdiff = "gdsdiff.cli:main"
gdsdiff-diagnostics = "gdsdiff.diagnostics:main"
gdsdiff-prepare-cuda = "gdsdiff.cuda_setup:main"

[project.urls]
Homepage = "https://github.com/SandboChang/gdsdiff"
Issues = "https://github.com/SandboChang/gdsdiff/issues"
Repository = "https://github.com/SandboChang/gdsdiff"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gdsdiff*"]

[tool.setuptools.package-data]
gdsdiff = [
  "py.typed",
  "schemas/*.json",
  "native_src/*.cpp",
  "native_src/gdsdiff/*",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv]
required-version = "==0.11.29"

[dependency-groups]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "pytest>=8",
  "twine>=5",
]
